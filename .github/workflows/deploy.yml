name: Deploy Vibbo

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vibbo-web

jobs:
  # ─────────────────────────────────────────────
  # Build & Push Docker Image
  # ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=https://studio.vidbolt.app
            COMMIT_SHA=${{ github.sha }}

  # ─────────────────────────────────────────────
  # Deploy to Hetzner
  # ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository_owner }}/vibbo-web
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME,GHCR_TOKEN,GHCR_USER
          script: |
            cd /home/deploy/vibbo

            # Authenticate with GitHub Container Registry
            echo "${GHCR_TOKEN}" | docker login ${REGISTRY} -u ${GHCR_USER} --password-stdin

            # Pull latest image
            docker pull ${REGISTRY}/${IMAGE_NAME}:latest

            # Deploy (or recreate) app + workers
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --force-recreate app workers

            # Clean up old images (keep last 3 days)
            docker image prune -a --filter "until=72h" -f

            echo "✅ Deployment complete at $(date)"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            # Wait for health check
            sleep 15

            # Check app is responding
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://studio.vidbolt.app/api/health)
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "❌ Health check failed (HTTP $HTTP_STATUS)"
              exit 1
            fi

            echo "✅ Health check passed"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "⚠️ Deployment failed — rolling back..."
            cd /home/deploy/vibbo
            docker compose -f docker-compose.prod.yml up -d --force-recreate app workers
