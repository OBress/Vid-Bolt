name: Deploy Vibbo

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: obress/vibbo-web

jobs:
  # ─────────────────────────────────────────────
  # Build & Push Docker Image
  # ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./web
          file: ./web/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=https://studio.vidbolt.app
            COMMIT_SHA=${{ github.sha }}

  # ─────────────────────────────────────────────
  # Deploy to Hetzner
  # ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: obress/vibbo-web
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GHCR_USER: obress
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME,GHCR_TOKEN,GHCR_USER
          script: |
            set -e

            cd /home/deploy/vibbo

            # Authenticate with GitHub Container Registry
            echo "${GHCR_TOKEN}" | docker login ${REGISTRY} -u ${GHCR_USER} --password-stdin

            # Pull latest image (fails deploy if denied)
            docker pull ${REGISTRY}/${IMAGE_NAME}:latest

            # Deploy (or recreate) app + workers
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --force-recreate app workers

            # Clean up old images (keep last 3 days)
            docker image prune -a --filter "until=72h" -f

            echo "✅ Deployment complete at $(date)"


      - name: Verify deployment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            # Wait for health check
            sleep 15

            # Check app is responding (307 = redirect to login, means app is up)
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://studio.vidbolt.app/api/health)
            if [ "$HTTP_STATUS" -ge 500 ] || [ "$HTTP_STATUS" = "000" ]; then
              echo "❌ Health check failed (HTTP $HTTP_STATUS)"
              exit 1
            fi

            echo "✅ Health check passed (HTTP $HTTP_STATUS)"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "⚠️ Deployment failed — rolling back..."
            cd /home/deploy/vibbo
            docker compose -f docker-compose.prod.yml up -d --force-recreate app workers

      # ─────────────────────────────────────────────
      # Discord Notifications
      # ─────────────────────────────────────────────
      - name: Notify Discord (success)
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.actor }}
          # Routed through an env var (never interpolated into the shell
          # command itself) so a commit message containing quotes or
          # shell metacharacters can't break out and run arbitrary
          # commands in this job — which has access to the Hetzner SSH
          # key and GHCR token.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n1)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg sha "$COMMIT_SHA" \
            --arg author "$COMMIT_AUTHOR" \
            --arg msg "$FIRST_LINE" \
            --arg ts "$TIMESTAMP" \
            '{embeds: [{
              title: "✅ Deployment Succeeded",
              description: "**Commit:** `\($sha)`\n**Author:** \($author)\n**Message:** \($msg)",
              color: 3066993,
              footer: {text: "VidBolt CI/CD"},
              timestamp: $ts
            }]}' | curl -sS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

      - name: Notify Discord (failure)
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "❌ Deployment Failed",
              "description": "**Commit:** `'"${{ github.sha }}"'`\n**Author:** '"${{ github.actor }}"'\n**Run:** [View logs]('"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"')",
              "color": 15158332,
              "footer": { "text": "VidBolt CI/CD" },
              "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
            }]
          }' "$DISCORD_WEBHOOK"
