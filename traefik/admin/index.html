<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidBolt Admin</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e0e0e0;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, #a78bfa, #6366f1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        font-size: 0.875rem;
        color: #888;
        margin-bottom: 2rem;
      }
      .links {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem 1.5rem;
        border-radius: 12px;
        background: #16161f;
        border: 1px solid #2a2a3a;
        color: #e0e0e0;
        text-decoration: none;
        transition: all 0.2s;
        min-width: 180px;
      }
      a:hover {
        border-color: #6366f1;
        background: #1a1a2e;
        transform: translateY(-2px);
      }
      .icon {
        font-size: 1.5rem;
      }
      .label {
        font-weight: 500;
      }
      .desc {
        font-size: 0.75rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>VidBolt Admin</h1>
      <p>Server administration dashboard</p>
      <div class="links">
        <a href="/grafana/">
          <span class="icon">📊</span>
          <div>
            <div class="label">Grafana</div>
            <div class="desc">Metrics & monitoring</div>
          </div>
        </a>
        <a href="/queues/">
          <span class="icon">📋</span>
          <div>
            <div class="label">Queue Dashboard</div>
            <div class="desc">BullMQ job queues</div>
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
