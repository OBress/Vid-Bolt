# =============================================================================
# Traefik Dynamic Configuration — Middlewares
# =============================================================================

http:
  middlewares:
    # Basic Auth for admin subdomain (queues + grafana)
    admin-auth:
      basicAuth:
        users:
          - "admin:$apr1$PCLR3JR/$imavJ9UR/GRa82vDAqRFH."

    # Strip /queues prefix before forwarding to BullBoard
    strip-queues:
      stripPrefix:
        prefixes:
          - "/queues"

    # Rate limiting
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

    # Security headers
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"

    # Compress responses (exclude SSE streams)
    compress:
      compress:
        excludedContentTypes:
          - "text/event-stream"
