# =============================================================================
# Redis Production Configuration — Vibbo
# =============================================================================
# Optimised for BullMQ job queue workloads on Hetzner CX-43.
# =============================================================================

# Persistence: AOF (Append-Only File) for durability
appendonly yes
appendfsync everysec

# Memory management
maxmemory 768mb
maxmemory-policy allkeys-lru

# Performance
tcp-keepalive 300
timeout 0

# Logging
loglevel notice

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# Save snapshots (RDB) as backup alongside AOF
save 900 1
save 300 10
save 60 10000
